<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="A beautiful bilingual calculator for Android and iOS." />
  <title>Calculatrice | Calculator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="langBtn" class="icon-btn" aria-label="Change language" title="Change language">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 2a8 8 0 0 1 6.9 3.1L13 9.1V7h-2v6h6v-2h-3.1l5.9-5.9A8 8 0 0 0 12 4zm0 16a8 8 0 0 1-6.9-3.1L11 14.9V17h2v-6H9v2h3.1l-5.9 5.9A8 8 0 0 1 4 12a8 8 0 0 1 8-8 8 8 0 0 1 0 16z"/></svg>
      </button>
      <h1 id="title">Calculatrice</h1>
      <button id="clearBtn" class="icon-btn" aria-label="Clear" title="Clear">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 6h12v12H6z" opacity="0"/><path fill="currentColor" d="M8 7h8v2H8V7zm0 4h8v2H8v-2zm0 4h8v2H8v-2zm10 3h-2.6l-4.4 4.4a1 1 0 0 1-1.4 0L8.6 18H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1z"/></svg>
      </button>
    </header>

    <section class="display">
      <div id="history" class="history" aria-live="polite"></div>
      <div id="current" class="current" aria-live="polite">0</div>
    </section>

    <section class="pad" id="pad">
      <button class="key" data-action="clear">AC</button>
      <button class="key" data-action="sign">±</button>
      <button class="key" data-action="percent">%</button>
      <button class="key op" data-op="divide">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-op="multiply">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-op="minus">−</button>

      <button class="key" data-num="3">3</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="1">1</button>
      <button class="key op" data-op="plus">+</button>

      <button class="key zero" data-num="0">0</button>
      <button class="key" data-action="dot">.</button>
      <button class="key equals" data-action="equals">=</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
